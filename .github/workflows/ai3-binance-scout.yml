name: AI3 Binance Zero-Capital Scout

on:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    paths:
      - 'app/api/agents/binance-scout/**'
      - 'lib/binance-scout.ts'
      - '.github/workflows/ai3-binance-scout.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  runtime-check:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check AI3 endpoint
        env:
          BASE_URL: https://agentflow-khaki-rho.vercel.app
          AGENT_HEARTBEAT_SECRET: ${{ secrets.AGENT_HEARTBEAT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$AGENT_HEARTBEAT_SECRET"
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 60 \
            -X POST "$BASE_URL/api/agents/binance-scout" \
            -H "x-agent-heartbeat-secret: $AGENT_HEARTBEAT_SECRET" \
            -H "content-type: application/json" \
            -d '{"trigger":"github_actions"}'

name: Primary agents keepalive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping primary agents + website + autopilot
        env:
          BASE_URL: ${{ secrets.AGENTFLOW_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AGENT_HEARTBEAT_SECRET: ${{ secrets.AGENT_HEARTBEAT_SECRET }}
        run: |
          set -euo pipefail
          BASE="${BASE_URL:-https://agentflow-khaki-rho.vercel.app}"
          AUTH_ARGS=(-H "x-vercel-cron: 1" -H "cache-control: no-store")
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH_ARGS+=(-H "Authorization: Bearer ${CRON_SECRET}")
          elif [ -n "${AGENT_HEARTBEAT_SECRET:-}" ]; then
            AUTH_ARGS+=(-H "Authorization: Bearer ${AGENT_HEARTBEAT_SECRET}")
          fi

          echo "== primary-agents =="
          curl -sS -m 90 "${BASE}/api/cron/primary-agents" "${AUTH_ARGS[@]}" | tee /tmp/primary.json | head -c 500
          echo

          echo "== website =="
          curl -sS -m 45 "${BASE}/api/cron/website" "${AUTH_ARGS[@]}" | tee /tmp/website.json | head -c 400
          echo

          echo "== autopilot =="
          curl -sS -m 60 "${BASE}/api/autopilot/cron" "${AUTH_ARGS[@]}" | tee /tmp/auto.json | head -c 400
          echo

          echo "keepalive completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

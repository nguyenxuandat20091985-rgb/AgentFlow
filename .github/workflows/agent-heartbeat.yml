name: AgentFlow automation loop

on:
  schedule:
    # 30-minute cadence keeps the monthly free Actions budget comfortable.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ vars.AGENTFLOW_APP_URL }}
      HEARTBEAT_SECRET: ${{ secrets.AGENT_HEARTBEAT_SECRET }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${APP_URL:-}" ]] || { echo "ERROR: AGENTFLOW_APP_URL is missing."; exit 1; }
          [[ -n "${HEARTBEAT_SECRET:-}" ]] || { echo "ERROR: AGENT_HEARTBEAT_SECRET is missing."; exit 1; }
          [[ "${APP_URL}" =~ ^https://[^[:space:]]+$ ]] || { echo "ERROR: AGENTFLOW_APP_URL must be https://."; exit 1; }

      - name: Heartbeat SalesBot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 \
            -X POST "${APP_URL%/}/api/agents/heartbeat" \
            -H "content-type: application/json" \
            -H "x-agent-heartbeat-secret: ${HEARTBEAT_SECRET}" \
            --data '{"agentId":"salesbot"}'

      - name: Heartbeat Marketing
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 \
            -X POST "${APP_URL%/}/api/agents/heartbeat" \
            -H "content-type: application/json" \
            -H "x-agent-heartbeat-secret: ${HEARTBEAT_SECRET}" \
            --data '{"agentId":"marketing"}'

      - name: Run AgentFlow runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 120 \
            -X POST "${APP_URL%/}/api/agents/runtime" \
            -H "content-type: application/json" \
            -H "x-agent-heartbeat-secret: ${HEARTBEAT_SECRET}" \
            --data '{}'

      - name: Refresh website catalog
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 60 \
            -X GET "${APP_URL%/}/api/website/refresh" \
            -H "authorization: Bearer ${HEARTBEAT_SECRET}"

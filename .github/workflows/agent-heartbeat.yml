name: AgentFlow automation loop

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  automation:
    runs-on: ubuntu-latest
: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_URL: ${{ vars.AGENTFLOW_APP_URL }}
      HEARTBEAT_SECRET: ${{ secrets.AGENT_HEARTBEAT_SECRET }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${APP_URL:-}" ]] || { echo "ERROR: AGENTFLOW_APP_URL is missing."; exit 1; }
          [[ -n "${HEARTBEAT_SECRET:-}" ]] || { echo "ERROR: AGENT_HEARTBEAT_SECRET is missing."; exit 1; }
          [[ "${APP_URL}" =~ ^https://[^[:space:]]+$ ]] || { echo "ERROR: AGENTFLOW_APP_URL must be https://."; exit 1; }

      - name: Heartbeat SalesBot (AI Website)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 \
            -X POST "${APP_URL%/}/api/agents/heartbeat" \
            -H "content-type: application/json" \
            -H "authorization: Bearer ${HEARTBEAT_SECRET}" \
            -H "x-agent-heartbeat-secret: ${HEARTBEAT_SECRET}" \
            --data '{"agentId":"salesbot"}'

      - name: Heartbeat Marketing
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 \
            -X POST "${APP_URL%/}/api/agents/heartbeat" \
            -H "content-type: application/json" \
            -H "authorization: Bearer ${HEARTBEAT_SECRET}" \
            -H "x-agent-heartbeat-secret: ${HEARTBEAT_SECRET}" \
            --data '{"agentId":"marketing"}'

      - name: Run AI Website runtime (LLM optional — non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 1 --retry-delay 2 --connect-timeout 10 --max-time 90 \
            -X POST "${APP_URL%/}/api/agents/runtime" \
            -H "content-type: application/json" \
            -H "authorization: Bearer ${HEARTBEAT_SECRET}" \
            -H "x-agent-heartbeat-secret: ${HEARTBEAT_SECRET}" \
            --data '{"agentId":"salesbot"}' || echo "runtime soft-fail (rate limit / LLM)"

      - name: Hunt public website buyer-intent signals
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 90 \
            -X POST "${APP_URL%/}/api/website/hunt" \
            -H "content-type: application/json" \
            -H "authorization: Bearer ${HEARTBEAT_SECRET}" \
            -H "x-agent-heartbeat-secret: ${HEARTBEAT_SECRET}"

      - name: Build website outreach drafts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 90 \
            -X POST "${APP_URL%/}/api/website/outreach" \
            -H "content-type: application/json" \
            -H "authorization: Bearer ${HEARTBEAT_SECRET}" \
            -H "x-agent-heartbeat-secret: ${HEARTBEAT_SECRET}"

      - name: AI CEO website cycle (review + Tier A publish)
        shell: bash
        run: |
          set -euo pipefail
          # Prefer unified deterministic cycle (no OpenAI required)
          code=$(curl --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 180 \
            -o /tmp/ceo-cycle.json -w "%{http_code}" \
            -X POST "${APP_URL%/}/api/ceo/website-cycle" \
            -H "content-type: application/json" \
            -H "authorization: Bearer ${HEARTBEAT_SECRET}" \
            -H "x-agent-heartbeat-secret: ${HEARTBEAT_SECRET}" || true)
          cat /tmp/ceo-cycle.json || true
          if [[ "$code" != "200" ]]; then
            echo "website-cycle returned $code — fallback outreach-review"
            curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 180 \
              -X POST "${APP_URL%/}/api/ceo/outreach-review" \
              -H "content-type: application/json" \
              -H "authorization: Bearer ${HEARTBEAT_SECRET}" \
              -H "x-agent-heartbeat-secret: ${HEARTBEAT_SECRET}"
          fi

      - name: Flush remaining Tier A autopublish
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 90 \
            -X POST "${APP_URL%/}/api/website/autopublish" \
            -H "content-type: application/json" \
            -H "authorization: Bearer ${HEARTBEAT_SECRET}" \
            -H "x-agent-heartbeat-secret: ${HEARTBEAT_SECRET}"
